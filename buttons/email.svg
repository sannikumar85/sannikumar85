<svg xmlns="http://www.w3.org/2000/svg" width="210" height="82" viewBox="0 0 210 82">
  <defs>
    <filter id="neu" x="-45%" y="-65%" width="190%" height="230%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="shadow"/>
  <feOffset in="shadow" dx="-4" dy="-4" result="lightOffset"/>
  <feFlood flood-color="#FFFFFF" flood-opacity="0.95" result="lightColor"/>
  <feComposite in="lightColor" in2="lightOffset" operator="in" result="light"/>
  <feOffset in="shadow" dx="5" dy="5" result="darkOffset"/>
  <feFlood flood-color="#A3AAB8" flood-opacity="0.75" result="darkColor"/>
  <feComposite in="darkColor" in2="darkOffset" operator="in" result="dark"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="glowBlur">
    <animate attributeName="stdDeviation" values="4;9;4" dur="3s" repeatCount="indefinite"/>
  </feGaussianBlur>
  <feFlood flood-color="#FFFFFF" flood-opacity="0.8" result="glowColor">
    <animate attributeName="flood-opacity" values="0.25;0.8;0.25" dur="3s" repeatCount="indefinite"/>
  </feFlood>
  <feComposite in="glowColor" in2="glowBlur" operator="in" result="glow"/>
  <feMerge>
    <feMergeNode in="glow"/>
    <feMergeNode in="light"/>
    <feMergeNode in="dark"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
  </defs>

  <rect x="15" y="12" width="180" height="58" rx="16"
      fill="#E6EAF5" filter="url(#neu)">
  <animateTransform attributeName="transform" type="translate"
    values="0 0;0 -1.5;0 0" dur="3s" repeatCount="indefinite"/>
</rect>

  <text x="48" y="49" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="21"
        font-weight="bold" fill="#35445B">@</text>

  <text x="125" y="47" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="13"
        font-weight="bold" letter-spacing="0.5"
        fill="#35445B">EMAIL</text>
</svg>

