<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanni Kumar | Developer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    color: #e6edf3;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

.container {
    width: 100%;
    max-width: 1100px;
    padding: 30px;
    text-align: center;
    perspective: 1000px;
}

.eyebrow {
    color: #8b949e;
    letter-spacing: 5px;
    font-size: 13px;
    margin-bottom: 28px;
}

#tagline {
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(25px, 5vw, 48px);
    line-height: 1.3;
    font-weight: 800;
    color: #eaffef;
    opacity: 0;
    transform: rotateX(-65deg) translateY(35px) scale(.92);
    text-shadow:
        1px 1px 0 #15803d,
        2px 2px 0 #166534,
        3px 3px 0 #14532d,
        0 0 8px #22c55e,
        0 0 18px #22c55e;
    transition:
        opacity .55s ease,
        transform .7s cubic-bezier(.2,.8,.2,1);
}

#tagline.visible {
    opacity: 1;
    transform: rotateX(0deg) translateY(0) scale(1);
    animation: greenGlow 2s ease-in-out infinite;
}

@keyframes greenGlow {
    0%, 100% {
        text-shadow:
            1px 1px 0 #15803d,
            2px 2px 0 #166534,
            3px 3px 0 #14532d,
            0 0 8px #22c55e,
            0 0 18px #22c55e;
    }

    50% {
        text-shadow:
            1px 1px 0 #15803d,
            2px 2px 0 #166534,
            3px 3px 0 #14532d,
            0 0 14px #4ade80,
            0 0 28px #22c55e,
            0 0 48px #16a34a;
    }
}

.caption {
    margin-top: 35px;
    color: #8b949e;
    font-size: 13px;
    letter-spacing: 3px;
}

@media (prefers-reduced-motion: reduce) {
    #tagline,
    #tagline.visible {
        animation: none;
        transition: none;
    }
}
</style>
</head>

<body>
<main class="container">
    <div class="eyebrow">SANNI KUMAR · DEVELOPER</div>

    <div id="tagline" aria-live="polite"></div>

    <div class="caption">CODE · INNOVATE · BUILD · DELIVER</div>
</main>

<script>
const taglines = [
    "Full Stack Developer",
    "Building Scalable Web Applications",
    "Crafting Modern User Experiences",
    "Exploring AI & Data Engineering",
    "Turning Ideas Into Intelligent Solutions",
    "Code • Innovate • Build • Deliver"
];

const element = document.getElementById("tagline");
let currentIndex = 0;

function showTagline() {
    element.classList.remove("visible");

    setTimeout(() => {
        element.textContent = taglines[currentIndex];
        element.classList.add("visible");

        currentIndex = (currentIndex + 1) % taglines.length;
    }, 600);
}

showTagline();
setInterval(showTagline, 3500);
</script>
</body>
</html>
